<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      --card: rgba(255,255,255,0.05);
      --card2: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.05);
      --text: #e0e0e0;
      --muted: #888;
      --accent: #ff4ec7;
      --accent-2: #ff2ea1;
      --track: #333;
      --thumb: #666;
    }
    body[data-theme="black"] {
      --bg: #0b0b0b;
      --card: rgba(255,255,255,0.04);
      --card2: rgba(255,255,255,0.02);
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.05);
      --text: #e8e8e8;
      --muted: #a0a0a0;
      --accent: #ff4ec7;
      --accent-2: #ff2ea1;
      --track: #2b2b2b;
      --thumb: #777;
    }

    body[data-theme="loser"] {
      --bg: linear-gradient(135deg, #1a0011 0%, #2d0020 50%, #0d000a 100%);
      --card: rgba(255,0,80,0.06);
      --card2: rgba(255,0,80,0.03);
      --border: rgba(255,0,100,0.2);
      --border2: rgba(255,0,100,0.08);
      --text: #ff99cc;
      --muted: #cc6699;
      --accent: #ff0066;
      --accent-2: #cc0052;
      --track: #3a0022;
      --thumb: #ff3399;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    
    .header {
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }
    
    .header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }
    
    .header p {
      font-size: 11px;
      color: var(--muted);
    }
    
    .master-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    
    .master-toggle span {
      font-weight: 600;
      font-size: 14px;
    }
    
    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 12px 0 8px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .toggle-group {
      background: var(--card2);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    
    .toggle-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border2);
    }
    
    .toggle-item:last-child {
      border-bottom: none;
    }
    
    .toggle-item .toggle-label {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      cursor: pointer;
    }
    .toggle-item .toggle-icon {
      font-size: 16px;
      width: 22px;
      text-align: center;
      flex-shrink: 0;
      line-height: 1;
    }
    .toggle-item label {
      font-size: 12px;
      cursor: pointer;
      flex: 1;
    }
    
    .toggle-item.exposed label {
      color: #ff6b6b;
    }
    
    .toggle-item.covered label {
      color: #69db7c;
    }
    
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }
    
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--track);
      transition: 0.3s;
      border-radius: 22px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: var(--thumb);
      transition: 0.3s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: var(--accent);
    }
    
    input:checked + .slider:before {
      transform: translateX(18px);
      background-color: #fff;
    }
    
    .master-toggle input:checked + .slider {
      background-color: #27ae60;
    }
    
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    
    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: #3498db;
      color: white;
    }
    
    .btn-primary:hover {
      background: #2980b9;
    }
    
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: var(--text);
    }
    
    .btn-secondary:hover {
      background: rgba(255,255,255,0.15);
    }
    
    .status {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 12px;
      padding: 8px;
      background: var(--card2);
      border-radius: 6px;
    }
    
    .status.loading {
      color: #f39c12;
    }
    
    .status.ready {
      color: #27ae60;
    }
    
    .quick-actions {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    
    .quick-btn {
      flex: 1;
      padding: 6px 8px;
      font-size: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: transparent;
      color: var(--muted);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .quick-btn:hover {
      background: var(--card);
      color: var(--text);
    }
    
    .confidence-setting {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--card2);
      border-radius: 8px;
      margin-bottom: 12px;
    }
    
    .confidence-setting label {
      font-size: 12px;
      flex-shrink: 0;
    }
    
    .confidence-setting input[type="range"] {
      flex: 1;
      height: 4px;
      -webkit-appearance: none;
      background: #333;
      border-radius: 2px;
      outline: none;
    }
    
    .confidence-setting input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: #3498db;
      border-radius: 50%;
      cursor: pointer;
    }
    
    .confidence-value {
      font-size: 12px;
      font-weight: 600;
      color: #3498db;
      min-width: 35px;
      text-align: right;
    }
    
    .style-setting {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--card2);
      border-radius: 8px;
      margin-bottom: 12px;
    }
    
    .style-setting label {
      font-size: 12px;
      flex-shrink: 0;
    }
    
    .style-setting select {
      flex: 1;
      padding: 6px 10px;
      background: #333;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }
    
    .style-setting select:hover {
      background: #444;
    }
    
    .custom-setting {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      background: var(--card2);
      border-radius: 8px;
      margin-bottom: 8px;
    }
    
    .custom-setting label {
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .custom-setting input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body data-theme="black">
<div class="header">
  <h1>
    <img src="icons/icon48.png" alt="Logo" style="width: 18px; height: 18px; vertical-align: middle; margin-right: 6px; margin-bottom: 2px;">
    Censr
  </h1>
  <p>AI-powered content filtering</p>
</div>

  
  <div class="master-toggle">
    <span>Extension Enabled</span>
    <label class="switch">
      <input type="checkbox" id="masterToggle" checked>
      <span class="slider"></span>
    </label>
  </div>
  
  <div class="confidence-setting">
    <label>Confidence:</label>
    <input type="range" id="confidenceSlider" min="10" max="90" value="25">
    <span class="confidence-value" id="confidenceValue">25%</span>
  </div>
  
  <div class="style-setting">
    <label>Censor Style:</label>
    <select id="censorStyle">
      <optgroup label="Classic">
        <option value="blur">Blur</option>
        <option value="heavy-blur">Heavy Blur</option>
        <option value="pixel">Pixelate</option>
        <option value="black">Black Bar</option>
        <option value="white">White Bar</option>
      </optgroup>
      <optgroup label="Patterns">
        <option value="bars">Scanline Bars</option>
        <option value="diamond">Diamond Grid</option>
        <option value="noise">TV Static</option>
        <option value="gradient">Rainbow</option>
        <option value="spiral">Hypno Spiral</option>
      </optgroup>
      <optgroup label="Fun">
        <option value="sticker">🚫 Stickers</option>
        <option value="hearts">💕 Hearts</option>
        <option value="redact">[REDACTED]</option>
        <option value="glitch">Glitch</option>
        <option value="invert">Invert</option>
      </optgroup>
    </select>
  </div>
  
  <div class="quick-actions">
    <button class="quick-btn" id="selectAll">Select All</button>
    <button class="quick-btn" id="selectExposed">Exposed Only</button>
    <button class="quick-btn" id="selectNone">Clear All</button>
  </div>
  
  <div class="section-title">🔴 Exposed Content</div>
  <div class="toggle-group" id="exposedGroup"></div>
  
  <div class="section-title">🟢 Covered Content</div>
  <div class="toggle-group" id="coveredGroup"></div>
  
  <div class="section-title">⚙️ Options</div>
  <div class="custom-setting">
    <label>
      <input type="checkbox" id="useCustomLabels">
      Use custom label text
    </label>
  </div>
  <div class="custom-setting">
    <label>
      <input type="checkbox" id="useImageOverlay">
      Use images instead of blur/black
    </label>
  </div>
  <div class="custom-setting">
    <label>
      <input type="checkbox" id="initialBlurEnabled">
      Pre-blur images before scan
    </label>
  </div>
  
  <div class="actions">
    <button class="btn btn-primary" id="rescanBtn">🔄 Rescan Page</button>
    <button class="btn btn-secondary" id="settingsBtn">⚙️ Full Settings</button>
  </div>
  
  <div class="status" id="status">Loading...</div>

  <script src="popup.js"></script>
</body>
</html>
